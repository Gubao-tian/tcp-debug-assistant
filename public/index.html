<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCP 调试助手 · Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>TCP 调试助手</h1>
        <span class="subtitle">Pro · 实时报文收发与协议调试</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="conn-badge" id="connBadge">
        <span class="dot offline"></span>
        <span class="label">未连接</span>
      </span>
      <button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换主题">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：连接控制 -->
    <aside class="col col-left">
      <!-- 模式切换 -->
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="client">客户端</button>
        <button class="mode-btn" data-mode="server">服务端</button>
        <span class="mode-slider" aria-hidden="true"></span>
      </div>

      <!-- 客户端模式 -->
      <section class="card" id="clientCard">
        <div class="card-head"><h2>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          TCP 客户端</h2></div>
        <div class="field-row">
          <label>主机
            <input type="text" id="clientHost" value="127.0.0.1" placeholder="IP 或域名" spellcheck="false" />
          </label>
          <label class="port">端口
            <input type="number" id="clientPort" value="9000" min="1" max="65535" />
          </label>
        </div>
        <label class="check-row">
          <input type="checkbox" id="autoReconnect" /> 断线自动重连
        </label>
        <div class="btn-row">
          <button class="btn primary" id="btnClientConnect">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            连接
          </button>
          <button class="btn ghost danger" id="btnClientDisconnect" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M5.5 6.5a8 8 0 1 0 13 0"/></svg>
            断开
          </button>
        </div>
      </section>

      <!-- 服务端模式 -->
      <section class="card hidden" id="serverCard">
        <div class="card-head"><h2>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="6" rx="1.5"/><rect x="2" y="13" width="20" height="6" rx="1.5"/><path d="M6 6h.01M6 16h.01"/></svg>
          TCP 服务端</h2></div>
        <div class="field-row">
          <label>监听端口
            <input type="number" id="serverPort" value="9000" min="1" max="65535" />
          </label>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="btnServerStart">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1a10 10 0 0 1 14.2 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/></svg>
            启动监听
          </button>
          <button class="btn ghost danger" id="btnServerStop" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            停止
          </button>
        </div>
        <div class="client-box">
          <div class="client-box-head">
            <span>已连接客户端</span>
            <span class="pill" id="clientCount">0</span>
          </div>
          <ul id="clientList" class="client-list">
            <li class="empty">暂无连接</li>
          </ul>
        </div>
      </section>
    </aside>

    <!-- 中栏：日志 -->
    <section class="col col-center workspace">
      <div class="ws-head">
        <div class="seg" id="filterSeg" role="group" aria-label="方向筛选">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="recv">接收</button>
          <button class="filter-btn" data-filter="send">发送</button>
        </div>
        <div class="ws-tools">
          <div class="search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="searchInput" placeholder="搜索报文 / 端点…" spellcheck="false" />
          </div>
          <div class="search hl-search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <input type="text" id="highlightInput" placeholder="高亮关键字…" spellcheck="false" />
          </div>
          <label class="select-inline">格式
            <select id="recvFormat">
              <option value="text">文本</option>
              <option value="hex">HEX</option>
              <option value="dump">HEX Dump</option>
            </select>
          </label>
          <label class="check-inline"><input type="checkbox" id="showTimestamp" checked /> 时间</label>
          <label class="check-inline"><input type="checkbox" id="autoScroll" checked /> 自动滚动</label>
        </div>
      </div>

      <div class="ws-actions">
        <button class="btn tiny" id="btnCopyAll">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制全部
        </button>
        <button class="btn tiny" id="btnExportText">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          导出文本
        </button>
        <button class="btn tiny" id="btnExportHex">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          导出 HEX
        </button>
        <button class="btn tiny ghost danger" id="btnClearLog">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清屏
        </button>
      </div>

      <!-- 多连接分标签 -->
      <div class="conn-tabs hidden" id="connTabs"></div>

      <div class="log" id="log"></div>

      <div class="statusbar">
        <span class="stat"><i class="recv-dot"></i>接收 <b id="statRecv">0 B</b></span>
        <span class="stat"><i class="send-dot"></i>发送 <b id="statSent">0 B</b></span>
        <span class="stat">速率 <b id="statRate">0 B/s</b></span>
        <span class="stat right">共 <b id="statCount">0</b> 条</span>
      </div>
    </section>

    <!-- 右栏：发送 -->
    <aside class="col col-right">
      <section class="card">
        <div class="card-head">
          <h2>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
            发送</h2>
          <div class="head-actions">
            <button class="link-btn" id="templateBtn">模板 ▾</button>
            <button class="link-btn" id="sendHistoryBtn">历史 ▾</button>
          </div>
        </div>

        <div class="send-target hidden" id="sendTargetWrap">
          <label>发送目标
            <select id="sendTarget">
              <option value="all">全部客户端</option>
            </select>
          </label>
        </div>

        <div class="seg small" role="group" aria-label="编码方式">
          <label><input type="radio" name="sendEncoding" value="text" checked /> 文本</label>
          <label><input type="radio" name="sendEncoding" value="hex" /> HEX</label>
        </div>
        <label class="check-row">
          <input type="checkbox" id="appendCRLF" /> 发送时追加 \r\n
        </label>

        <div class="send-box">
          <textarea id="sendData" rows="5" spellcheck="false" placeholder="输入发送内容；HEX 模式用空格或连续十六进制，如 48 65 6C 6C 6F"></textarea>
          <div class="send-meta">
            <span id="sendCounter" class="counter">0 字符 · 0 字节</span>
            <span id="hexWarn" class="warn hidden">HEX 格式错误</span>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn primary" id="btnSend">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
            发送
            <kbd>Ctrl⏎</kbd>
          </button>
          <button class="btn ghost" id="btnClearSend">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            清空
          </button>
        </div>

        <!-- 发送模板面板 -->
        <div class="history-panel hidden" id="templatePanel">
          <button class="save-tpl-btn" id="saveTemplateBtn">＋ 保存当前内容为模板</button>
          <ul id="templateList" class="history-list"></ul>
        </div>

        <!-- 发送历史面板 -->
        <div class="history-panel hidden" id="historyPanel">
          <ul id="historyList" class="history-list"></ul>
        </div>

        <!-- 自动发送 -->
        <div class="autosend">
          <div class="autosend-head"><span>自动发送</span></div>
          <div class="field-row">
            <label>间隔 (ms)
              <input type="number" id="autosendInterval" value="1000" min="100" step="100" />
            </label>
          </div>
          <div class="btn-row">
            <button class="btn ghost" id="btnAutosendStart">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              开始
            </button>
            <button class="btn ghost danger" id="btnAutosendStop" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              停止
            </button>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
